<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok connected – Path of Legends Autopost</title><style>body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;max-width:760px;margin:40px auto;padding:0 20px;line-height:1.65;color:#1d1d1f}h1{font-size:1.8rem}h2{font-size:1.2rem;margin-top:2rem}a{color:#0a66c2}footer{margin-top:3rem;font-size:.85rem;color:#666}code{background:#f3f3f3;padding:2px 6px;border-radius:4px}</style></head><body>
<h1>TikTok authorization</h1>
<p id="msg">Reading code…</p>
<p><input id="code" style="width:100%;padding:8px;font-family:monospace" readonly></p>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('code').value)">Copy code</button></p>
<script>
var q=new URLSearchParams(location.search);
if(q.get('code')){document.getElementById('msg').textContent='Copy this code and paste it into the setup script:';document.getElementById('code').value=q.get('code');}
else{document.getElementById('msg').textContent='No code received. '+(q.get('error_description')||q.get('error')||'');}
</script></body></html>
